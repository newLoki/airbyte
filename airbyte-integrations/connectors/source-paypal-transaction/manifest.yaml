version: 7.7.0

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - balances

definitions:
  linked:
    HttpRequester:
      url_base: https://api-m.{{ "sandbox." if config["is_sandbox"] }}paypal.com/
      authenticator:
        type: CustomAuthenticator
        client_id: "{{ config['client_id'] }}"
        class_name: source_declarative_manifest.components.PayPalOauth2Authenticator
        grant_type: client_credentials
        client_secret: "{{ config['client_secret'] }}"
        expires_in_name: expires_in
        access_token_name: access_token
        refresh_request_body:
          Content-Type: application/x-www-form-urlencoded
        token_refresh_endpoint: >-
          https://api-m.{{ "sandbox." if config["is_sandbox"]
          }}paypal.com/v1/oauth2/token
      request_headers:
        Content-Type: application/json
      error_handler:
        type: CompositeErrorHandler
        error_handlers:
          - type: DefaultErrorHandler
            backoff_strategies:
              - type: ConstantBackoffStrategy
                backoff_time_in_seconds: 100
    SimpleRetriever:
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: page_size
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: page
          inject_into: request_parameter
        pagination_strategy:
          type: PageIncrement
          page_size: 20
          start_from_page: 1

streams:
  - type: DeclarativeStream
    name: transactions
    retriever:
      type: SimpleRetriever
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: page_size
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: page
          inject_into: request_parameter
        pagination_strategy:
          type: PageIncrement
          page_size: 500
          start_from_page: 1
      requester:
        type: HttpRequester
        url_base:
          $ref: "#/definitions/linked/HttpRequester/url_base"
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        path: v1/reporting/transactions
        http_method: GET
        error_handler:
          type: CompositeErrorHandler
          error_handlers:
            - type: DefaultErrorHandler
              description: >-
                Handle HTTP 400 with error message: Data for the given start
                date is not available. 
              response_filters:
                - type: HttpResponseFilter
                  action: FAIL
                  predicate: >-
                    {{ 'Data for the given start date is not available' in
                    response['message']}}
                  http_codes:
                    - 400
        request_headers:
          $ref: "#/definitions/linked/HttpRequester/request_headers"
        request_parameters:
          fields: all
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - transaction_details
    primary_key:
      - transaction_id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type:
          - "null"
          - object
        $schema: http://json-schema.org/draft-07/schema#
        properties:
          cart_info:
            type:
              - "null"
              - object
            description: Details of items in the cart
            properties:
              item_details:
                type: array
                description: Details of individual items in the cart
                items:
                  type:
                    - "null"
                    - object
                  description: Properties of an item in the cart
                  properties:
                    item_code:
                      type:
                        - "null"
                        - string
                      description: Code representing the item
                      maxLength: 1000
                    item_name:
                      type:
                        - "null"
                        - string
                      description: Name of the item
                      maxLength: 256
                    item_amount:
                      type:
                        - "null"
                        - object
                      description: Amount of the item
                      properties:
                        value:
                          type: string
                          description: Value of the item amount
                          maxLength: 32
                        currency_code:
                          type: string
                          description: Currency code of the item amount
                          maxLength: 3
                          minLength: 3
                      additionalProperties: true
                    tax_amounts:
                      type: array
                      description: Tax amounts associated with the item
                      items:
                        type:
                          - "null"
                          - object
                        description: Properties of tax amount
                        properties:
                          tax_amount:
                            type:
                              - "null"
                              - object
                            description: Amount of tax
                            properties:
                              value:
                                type: string
                                description: Value of the tax amount
                                maxLength: 32
                              currency_code:
                                type: string
                                description: Currency code of the tax amount
                                maxLength: 3
                                minLength: 3
                            additionalProperties: true
                        additionalProperties: true
                    item_quantity:
                      type:
                        - "null"
                        - string
                      description: Quantity of the item
                    invoice_number:
                      type:
                        - "null"
                        - string
                      description: Invoice number associated with the item
                      maxLength: 200
                    item_unit_price:
                      type:
                        - "null"
                        - object
                      description: Unit price of the item
                      properties:
                        value:
                          type: string
                          description: Value of the unit price
                          maxLength: 32
                        currency_code:
                          type: string
                          description: Currency code of the unit price
                          maxLength: 3
                          minLength: 3
                      additionalProperties: true
                    item_description:
                      type:
                        - "null"
                        - string
                      description: Description of the item
                    total_item_amount:
                      type:
                        - "null"
                        - object
                      description: Total amount of the item
                      properties:
                        value:
                          type: string
                          description: Value of the total item amount
                          maxLength: 32
                        currency_code:
                          type: string
                          description: Currency code of the total item amount
                          maxLength: 3
                          minLength: 3
                      additionalProperties: true
                  additionalProperties: true
            additionalProperties: true
          payer_info:
            type:
              - "null"
              - object
            description: Information about the payer
            properties:
              account_id:
                type:
                  - "null"
                  - string
                description: ID of the payer's account
                maxLength: 13
              payer_name:
                type:
                  - "null"
                  - object
                description: Name of the payer
                properties:
                  surname:
                    type:
                      - "null"
                      - string
                    description: Surname of the payer
                    maxLength: 256
                  given_name:
                    type:
                      - "null"
                      - string
                    description: Given name of the payer
                    maxLength: 256
                  alternate_full_name:
                    type:
                      - "null"
                      - string
                    description: Alternate full name of the payer
                    maxLength: 256
                additionalProperties: true
              country_code:
                type:
                  - "null"
                  - string
                description: Country code of the payer
                maxLength: 3
              payer_status:
                type:
                  - "null"
                  - string
                description: Status of the payer's account
                maxLength: 1
              email_address:
                type:
                  - "null"
                  - string
                description: Email address of the payer
                maxLength: 256
              address_status:
                type:
                  - "null"
                  - string
                description: Status of the provided address
                maxLength: 1
            additionalProperties: true
          store_info:
            type:
              - "null"
              - object
            description: Information about the store
            properties:
              store_id:
                type:
                  - "null"
                  - string
                description: ID of the store
                maxLength: 100
              terminal_id:
                type:
                  - "null"
                  - string
                description: ID of the terminal
                maxLength: 60
            additionalProperties: true
          auction_info:
            type:
              - "null"
              - object
            description: Information related to an auction
            properties:
              auction_site:
                type:
                  - "null"
                  - string
                description: Site where the auction is taking place
                maxLength: 200
              auction_buyer_id:
                type:
                  - "null"
                  - string
                description: ID of the buyer in the auction
                maxLength: 500
              auction_item_site:
                type:
                  - "null"
                  - string
                description: Site where the auction item is listed
              auction_closing_date:
                type:
                  - "null"
                  - string
                description: Closing date and time of the auction
                format: date-time
            additionalProperties: true
          shipping_info:
            type:
              - "null"
              - object
            description: Shipping information
            properties:
              name:
                type:
                  - "null"
                  - string
                description: Name associated with the shipping information
                maxLength: 500
              address:
                type:
                  - "null"
                  - object
                description: Address for shipping
                properties:
                  city:
                    type:
                      - "null"
                      - string
                    description: City for the shipping address
                    maxLength: 256
                  line1:
                    type:
                      - "null"
                      - string
                    description: First line of the shipping address
                  line2:
                    type:
                      - "null"
                      - string
                    description: Second line of the shipping address
                  postal_code:
                    type:
                      - "null"
                      - string
                    description: Postal code of the shipping address
                    maxLength: 256
                  country_code:
                    type:
                      - "null"
                      - string
                    description: Country code of the shipping address
                    maxLength: 3
                additionalProperties: true
            additionalProperties: true
          incentive_info:
            type:
              - "null"
              - object
            description: Details of any incentives applied
            properties:
              incentive_details:
                type: array
                description: Details of individual incentives
                items:
                  type: object
                  description: Properties of an incentive
                  properties:
                    incentive_code:
                      type:
                        - "null"
                        - string
                      description: Code representing the incentive
                      maxLength: 200
                    incentive_type:
                      type:
                        - "null"
                        - string
                      description: Type of the incentive
                      maxLength: 500
                    incentive_amount:
                      type: object
                      description: Amount of the incentive
                      properties:
                        value:
                          type: string
                          description: Value of the incentive amount
                          maxLength: 32
                        currency_code:
                          type: string
                          description: Currency code of the incentive amount
                          maxLength: 3
                          minLength: 3
                      additionalProperties: true
                    incentive_program_code:
                      type:
                        - "null"
                        - string
                      description: Program code associated with the incentive
                      maxLength: 100
                  additionalProperties: true
            additionalProperties: true
          transaction_id:
            type:
              - "null"
              - string
            description: Unique ID of the transaction
            maxLength: 24
          transaction_info:
            type:
              - "null"
              - object
            description: Detailed information about the transaction
            properties:
              fee_amount:
                type:
                  - "null"
                  - object
                description: Fee amount for the transaction
                properties:
                  value:
                    type: string
                    description: Value of the fee amount
                    maxLength: 32
                  currency_code:
                    type: string
                    description: Currency code of the fee amount
                    maxLength: 3
                    minLength: 3
                additionalProperties: true
              invoice_id:
                type:
                  - "null"
                  - string
                description: ID of the invoice related to the transaction
                maxLength: 127
              custom_field:
                type:
                  - "null"
                  - string
                description: Custom field associated with the transaction
                maxLength: 127
              transaction_id:
                type:
                  - "null"
                  - string
                description: ID of the transaction
                maxLength: 24
              shipping_amount:
                type:
                  - "null"
                  - object
                description: Shipping amount for the transaction
                properties:
                  value:
                    type: string
                    description: Value of the shipping amount
                    maxLength: 32
                  currency_code:
                    type: string
                    description: Currency code of the shipping amount
                    maxLength: 3
                    minLength: 3
                additionalProperties: true
              insurance_amount:
                type:
                  - "null"
                  - object
                description: Insurance amount for the transaction
                properties:
                  value:
                    type: string
                    description: Value of the insurance amount
                    maxLength: 32
                  currency_code:
                    type: string
                    description: Currency code of the insurance amount
                    maxLength: 3
                    minLength: 3
                additionalProperties: true
              transaction_note:
                type:
                  - "null"
                  - string
                description: Note or comment related to the transaction
              paypal_account_id:
                type:
                  - "null"
                  - string
                description: ID of the PayPal account used in the transaction
                maxLength: 24
              transaction_amount:
                type:
                  - "null"
                  - object
                description: Total amount of the transaction
                properties:
                  value:
                    type: string
                    description: Value of the transaction amount
                    maxLength: 32
                  currency_code:
                    type: string
                    description: Currency code of the transaction amount
                    maxLength: 3
                    minLength: 3
                additionalProperties: true
              transaction_status:
                type:
                  - "null"
                  - string
                description: Status of the transaction
                maxLength: 1
              paypal_reference_id:
                type:
                  - "null"
                  - string
                description: Reference ID of the transaction in PayPal
                maxLength: 24
              transaction_subject:
                type:
                  - "null"
                  - string
                description: Subject or purpose of the transaction
                maxLength: 256
              protection_eligibility:
                type:
                  - "null"
                  - string
                description: Eligibility for protection in the transaction
                maxLength: 2
              transaction_event_code:
                type:
                  - "null"
                  - string
                description: Event code associated with the transaction
                maxLength: 5
              paypal_reference_id_type:
                type:
                  - "null"
                  - string
                description: Type of reference ID in PayPal
                maxLength: 3
                minLength: 3
              shipping_discount_amount:
                type:
                  - "null"
                  - object
                description: Discount amount applied to shipping
                properties:
                  value:
                    type: string
                    description: Value of the discount amount
                    maxLength: 32
                  currency_code:
                    type: string
                    description: Currency code of the discount amount
                    maxLength: 3
                    minLength: 3
                additionalProperties: true
              transaction_updated_date:
                type:
                  - "null"
                  - string
                description: Date and time when the transaction was last updated
                format: date-time
              transaction_initiation_date:
                type:
                  - "null"
                  - string
                description: Date and time when the transaction was initiated
                format: date-time
            additionalProperties: true
          transaction_updated_date:
            type:
              - "null"
              - string
            description: Date and time when the transaction was last updated
            format: date-time
          transaction_initiation_date:
            type:
              - "null"
              - string
            description: Date and time when the transaction was initiated
            format: date-time
        additionalProperties: true
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - transaction_updated_date
            value: >-
              {{
              format_datetime(record['transaction_info']['transaction_updated_date'],
              '%Y-%m-%dT%H:%M:%S.000Z') }}
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - transaction_id
            value: "{{ record['transaction_info']['transaction_id'] }}"
    incremental_sync:
      type: DatetimeBasedCursor
      step: P{{ config.get('time_window', 7) }}D
      cursor_field: transaction_updated_date
      end_datetime:
        type: MinMaxDatetime
        datetime: >-
          {{ format_datetime(config.get('end_date') if config.get('end_date')
          else now_utc(), '%Y-%m-%dT%H:%M:%S.000Z') }}
        datetime_format: "%Y-%m-%dT%H:%M:%S.000Z"
      start_datetime:
        type: MinMaxDatetime
        datetime: >-
          {{ max( format_datetime(config.get('start_date'),
          '%Y-%m-%dT%H:%M:%S.000Z'), day_delta(-1095, format='%Y-%m-%dT%H:%M:%S.000Z')) }}
        datetime_format: "%Y-%m-%dT%H:%M:%S.000Z"
      datetime_format: "%Y-%m-%dT%H:%M:%S.000Z"
      end_time_option:
        type: RequestOption
        field_name: end_date
        inject_into: request_parameter
      start_time_option:
        type: RequestOption
        field_name: start_date
        inject_into: request_parameter
      cursor_granularity: PT1S
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%S.000Z"
  - type: DeclarativeStream
    name: balances
    retriever:
      type: SimpleRetriever
      paginator:
        type: DefaultPaginator
        pagination_strategy:
          type: PageIncrement
          page_size: 500
      requester:
        type: HttpRequester
        url_base:
          $ref: "#/definitions/linked/HttpRequester/url_base"
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        path: v1/reporting/balances
        http_method: GET
        error_handler:
          $ref: "#/definitions/linked/HttpRequester/error_handler"
        request_headers:
          $ref: "#/definitions/linked/HttpRequester/request_headers"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
    primary_key:
      - as_of_time
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type:
          - "null"
          - object
        $schema: https://json-schema.org/draft-07/schema#
        properties:
          balances:
            type:
              - "null"
              - array
            description: Object containing information about the account balances.
            items:
              type:
                - "null"
                - object
              properties:
                primary:
                  type:
                    - "null"
                    - boolean
                  description: Indicates if the balance is the primary account balance.
                currency:
                  type:
                    - "null"
                    - string
                  description: The currency used for the account balances.
                total_balance:
                  type:
                    - "null"
                    - object
                  description: Total balance in the account, including all funds.
                  properties:
                    value:
                      type:
                        - "null"
                        - string
                      description: The numerical value of the total balance.
                    currency_code:
                      type:
                        - "null"
                        - string
                      description: The currency code for the total balance.
                withheld_balance:
                  type:
                    - "null"
                    - object
                  description: Balance that is currently being withheld or pending.
                  properties:
                    value:
                      type:
                        - "null"
                        - string
                      description: The numerical value of the withheld balance.
                    currency_code:
                      type:
                        - "null"
                        - string
                      description: The currency code for the withheld balance.
                available_balance:
                  type:
                    - "null"
                    - object
                  description: Available balance in the account.
                  properties:
                    value:
                      type:
                        - "null"
                        - string
                      description: The numerical value of the available balance.
                    currency_code:
                      type:
                        - "null"
                        - string
                      description: The currency code for the available balance.
          account_id:
            type:
              - "null"
              - string
            description: >-
              The unique identifier of the account associated with the balances
              data.
          as_of_time:
            type: string
            description: The timestamp when the balances data was reported.
          last_refresh_time:
            type:
              - "null"
              - string
            description: >-
              The timestamp when the balances data was last refreshed or
              updated.
        additionalProperties: true
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - as_of_time
            value: "{{ format_datetime(record['as_of_time'], '%Y-%m-%dT%H:%M:%S.000Z') }}"
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: as_of_time
      start_datetime:
        type: MinMaxDatetime
        datetime: >-
          {{ max( format_datetime(config.get('start_date'),
          '%Y-%m-%dT%H:%M:%S.000Z'), day_delta(-1095, format='%Y-%m-%dT%H:%M:%S.000Z') )
          }}
        datetime_format: "%Y-%m-%dT%H:%M:%S.000Z"
      datetime_format: "%Y-%m-%dT%H:%M:%S.000Z"
      start_time_option:
        type: RequestOption
        field_name: as_of_time
        inject_into: request_parameter
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%S.000Z"
  - type: DeclarativeStream
    name: list_products
    retriever:
      type: SimpleRetriever
      paginator:
        $ref: "#/definitions/linked/SimpleRetriever/paginator"
      requester:
        type: HttpRequester
        url_base:
          $ref: "#/definitions/linked/HttpRequester/url_base"
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        path: v1/catalogs/products
        http_method: GET
        error_handler:
          $ref: "#/definitions/linked/HttpRequester/error_handler"
        request_headers:
          $ref: "#/definitions/linked/HttpRequester/request_headers"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - products
    primary_key:
      - id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type:
          - "null"
          - object
        $schema: https://json-schema.org/draft-07/schema#
        properties:
          description:
            type:
              - "null"
              - string
            description: Detailed information or features of the product
          id:
            type:
              - "null"
              - string
            description: Unique identifier for the product
          name:
            type:
              - "null"
              - string
            description: The name or title of the product
          links:
            type: array
            description: List of links related to the fetched products.
            items:
              type: object
              description: Individual link item in the list.
              properties:
                rel:
                  type:
                    - "null"
                    - string
                  description: Relationship of the linked resource to the product
                href:
                  type:
                    - "null"
                    - string
                  description: The URL for the link
                method:
                  type:
                    - "null"
                    - string
                  description: HTTP method used for the link (GET, POST, PUT, DELETE, etc.)
              additionalProperties: true
          create_time:
            type:
              - "null"
              - string
            description: The time when the product was created
            format: date-time
        additionalProperties: true
  - type: DeclarativeStream
    name: show_product_details
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base:
          $ref: "#/definitions/linked/HttpRequester/url_base"
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        path: /v1/catalogs/products/{{ stream_slice.id }}
        http_method: GET
        error_handler:
          $ref: "#/definitions/linked/HttpRequester/error_handler"
        request_headers:
          $ref: "#/definitions/linked/HttpRequester/request_headers"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            stream:
              $ref: "#/streams/2"
            parent_key: id
            partition_field: id
    primary_key:
      - id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type:
          - "null"
          - object
        $schema: https://json-schema.org/draft-07/schema#
        properties:
          type:
            type:
              - "null"
              - string
            description: The type or category of the product
          description:
            type:
              - "null"
              - string
            description: The detailed description of the product
          id:
            type:
              - "null"
              - string
            description: The unique identifier for the product
          name:
            type:
              - "null"
              - string
            description: The name of the product
          links:
            type: array
            description: Contains links related to the product details.
            items:
              type:
                - "null"
                - object
              description: Individual link properties for a specific product.
              properties:
                rel:
                  type:
                    - "null"
                    - string
                  description: The relationship of the link to the product
                href:
                  type:
                    - "null"
                    - string
                  description: The URL associated with the link
                method:
                  type:
                    - "null"
                    - string
                  description: The HTTP method used for the link
              additionalProperties: true
          category:
            type:
              - "null"
              - string
            description: The category to which the product belongs
          home_url:
            type:
              - "null"
              - string
            description: The URL for the home page of the product
          image_url:
            type:
              - "null"
              - string
            description: The URL to the image representing the product
          create_time:
            type:
              - "null"
              - string
            description: The date and time when the product was created
            format: date-time
          update_time:
            type:
              - "null"
              - string
            description: The date and time when the product was last updated
            format: date-time
        additionalProperties: true
  - type: DeclarativeStream
    name: list_disputes
    retriever:
      type: SimpleRetriever
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: page_size
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: next_page_token
          inject_into: request_parameter
        pagination_strategy:
          type: PageIncrement
